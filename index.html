<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azka Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#fdf6e3;background-image:radial-gradient(#e8d9b0 1px,transparent 1px);background-size:18px 18px;color:#1a1a1a;min-height:100vh}
#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.lcard{background:#fff;border:4px solid #1a1a1a;border-radius:24px;padding:30px 24px;box-shadow:8px 8px 0 #1a1a1a;width:100%;max-width:400px;text-align:center}
.llogo{width:80px;height:80px;margin:0 auto 16px;background:#dc2626;border:4px solid #1a1a1a;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:5px 5px 0 #1a1a1a}
.lcard h1{font-family:'Archivo Black',sans-serif;font-size:24px;margin-bottom:6px}
.lcard p{font-size:12px;color:#666;margin-bottom:22px;font-weight:600}
.lcard label{display:block;text-align:left;font-size:12px;font-weight:800;margin:10px 0 6px;text-transform:uppercase}
.lcard input{width:100%;padding:14px;border:3px solid #1a1a1a;border-radius:12px;background:#fdf6e3;font-size:14px;outline:none;font-family:inherit;font-weight:600}
.lcard button{width:100%;padding:15px;background:#dc2626;color:#fff;border:3px solid #1a1a1a;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;box-shadow:4px 4px 0 #1a1a1a;margin-top:18px;text-transform:uppercase;font-family:inherit}
.lcard button:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #1a1a1a}
.lcard button:disabled{opacity:.6}
.lmsg{margin-top:14px;font-size:13px;font-weight:700;padding:10px;border-radius:10px}
.lmsg.err{color:#991b1b;background:#fee2e2;border:2px solid #991b1b}

#appScreen{display:none;padding-bottom:120px}
.header{background:#dc2626;border-bottom:4px solid #1a1a1a;padding:16px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 4px 0 #1a1a1a}
.header .menu-btn{width:42px;height:42px;background:#fff;border:3px solid #1a1a1a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:3px 3px 0 #1a1a1a;font-weight:900;cursor:pointer}
.header .title{flex:1;text-align:center;font-family:'Archivo Black',sans-serif;font-size:20px;color:#fff;letter-spacing:1px;text-shadow:2px 2px 0 #1a1a1a}
.header .icons{display:flex;gap:8px}
.header .icons .ico{width:42px;height:42px;background:#fff;border:3px solid #1a1a1a;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:3px 3px 0 #1a1a1a;cursor:pointer}
.container{padding:20px 18px;max-width:520px;margin:0 auto}
.dash{background:#fff;border:3px solid #1a1a1a;border-radius:18px;padding:18px;box-shadow:5px 5px 0 #1a1a1a;margin-bottom:18px}
.dash-top{display:flex;align-items:center;gap:14px}
.dash-avatar{width:56px;height:56px;border-radius:50%;background:#dc2626;border:3px solid #1a1a1a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;box-shadow:3px 3px 0 #1a1a1a;flex-shrink:0;position:relative;cursor:pointer;overflow:visible}
.dash-avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.dash-avatar .cam{position:absolute;bottom:-4px;right:-4px;width:24px;height:24px;background:#fbbf24;border:2px solid #1a1a1a;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px}
.dash-name{font-family:'Archivo Black',sans-serif;font-size:16px;text-transform:uppercase}
.dash-role{font-size:12px;font-weight:800;margin-top:2px}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.dash-box{background:#fdf6e3;border:3px solid #1a1a1a;border-radius:12px;padding:10px}
.dash-box .l{font-size:10px;color:#666;font-weight:800;text-transform:uppercase}
.dash-box .v{font-size:13px;font-weight:800;margin-top:2px}
.dash-warn{margin-top:10px;padding:10px;border-radius:10px;font-size:12px;font-weight:800;display:none}
.sec-head{margin-bottom:14px}
.sec-head .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sec-head h1{font-family:'Archivo Black',sans-serif;font-size:20px;text-transform:uppercase;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.sec-head .badge{background:#fbbf24;border:3px solid #1a1a1a;border-radius:10px;padding:6px 12px;font-weight:800;font-size:11px;box-shadow:3px 3px 0 #1a1a1a}
.sec-head p{font-size:12px;color:#555;margin-top:6px;font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:#fff;border:3px solid #1a1a1a;border-radius:18px;padding:16px 14px;box-shadow:5px 5px 0 #1a1a1a;cursor:pointer;position:relative;overflow:hidden;min-height:160px;display:flex;flex-direction:column}
.card:active{transform:translate(2px,2px);box-shadow:3px 3px 0 #1a1a1a}
.card .top-strip{position:absolute;top:0;left:0;width:100%;height:8px}
.card .ic-wrap{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;border:3px solid #1a1a1a;box-shadow:3px 3px 0 #1a1a1a;margin:12px 0 14px}
.card h3{font-family:'Archivo Black',sans-serif;font-size:15px;text-transform:uppercase;margin-bottom:4px;line-height:1.2}
.card p{font-size:11px;color:#555;font-weight:600;line-height:1.4}
.card .char{position:absolute;top:8px;right:8px;font-size:34px;transform:rotate(-10deg)}
.strip-red{background:#dc2626}.strip-green{background:#16a34a}.strip-blue{background:#2563eb}.strip-yellow{background:#fbbf24}.strip-teal{background:#0d9488}.strip-purple{background:#7c3aed}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fdf6e3;border-top:4px solid #1a1a1a;display:flex;padding:10px 4px 14px;z-index:100;justify-content:space-around;align-items:flex-end;overflow-x:auto}
.nav-item{flex:1;min-width:56px;text-align:center;font-size:9px;font-weight:800;cursor:pointer;color:#1a1a1a;padding:6px 2px}
.nav-item .ico{display:flex;align-items:center;justify-content:center;width:42px;height:42px;background:#fff;border:3px solid #1a1a1a;border-radius:12px;font-size:18px;margin:0 auto 6px;box-shadow:3px 3px 0 #1a1a1a}
.nav-item.active .ico{background:#fbbf24}
</style>
</head>
<body>

.edit-foto-box .btn-save{width:100%;padding:12px;background:#16a34a;color:#fff;border:3px solid #1a1a1a;border-radius:10px;font-size:14px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 #1a1a1a;margin-top:12px;text-transform:uppercase;font-family:inherit}

</head>
<body>

<div class="sb-overlay" id="sbOverlay" onclick="closeSb()"></div>
<div class="sidebar" id="sidebar">
  <div class="sb-head">
    <h3>👥 Daftar User</h3>
    <button class="sb-close" onclick="closeSb()">✕</button>
  </div>

</div>

<div id="loginScreen">
  <div class="lcard">
    <div class="llogo">🔥</div>
    <h1>AZKA PANEL</h1>
    <p>Login dulu buat akses tools</p>
    <label>Username</label>
    <input type="text" id="inpUser" placeholder="azka" autocomplete="off">
    <label>Password</label>
    <input type="password" id="inpPass" placeholder="password">
    <button id="btnLogin" onclick="doLogin()">Masuk</button>
    <div class="lmsg" id="loginMsg"></div>

</div>

<div id="appScreen">
  <div class="header">
    <div class="menu-btn" onclick="openSb()">☰</div>
    <div class="title">AZKA PANEL</div>
    <div class="icons">
      <div class="ico" onclick="doLogout()">🚪</div>
      <div class="ico" id="userIco">👤</div>
    </div>
  </div>
  <div class="container">
    <div class="dash">
      <div class="dash-top">
        <div class="dash-avatar" id="dashAvatar" onclick="openEditFoto()">
          <span id="dashAvatarText">A</span>
          <div class="cam">📷</div>
        </div>
        <div style="flex:1">
          <div class="dash-name" id="dashName">-</div>
          <div class="dash-role" id="dashRole">-</div>

      </div>
      <div class="dash-grid">
        <div class="dash-box"><div class="l">📅 Hari Ini</div><div class="v" id="dashToday">-</div></div>

      </div>

    </div>

      <div class="top">
        <h1>Kategori Menu</h1>
        <div class="badge" id="totalMod">0 MODULES</div>
      </div>
      <p>Pilih kategori menu yang Anda butuhkan.</p>

  </div>

    <div class="nav-item active" onclick="filterKat('all',this)"><div class="ico">🏠</div>HOME</div>
    <div class="nav-item" onclick="filterKat('downloader',this)"><div class="ico">📥</div>DL</div>
    <div class="nav-item" onclick="filterKat('stalker',this)"><div class="ico">🕵️</div>STALK</div>

    <div class="nav-item" onclick="filterKat('ai',this)"><div class="ico">🤖</div>AI</div>

<script>
var API_KEY='PREMIUM03DYWHDHWHFHAJXSJFHAJS';
var USERS=[];
var AKTIF='all';

async function loadUsers(){
  try{
    var r=await fetch('users.json?t='+Date.now());
    var j=await r.json();
    USERS=j.users||[];
  }catch(e){
    USERS=[{nama:'azka',password:'12345',role:'developer',expired:null}];
  }
}

async function doLogin(){
  var u=document.getElementById('inpUser').value.trim();
  var p=document.getElementById('inpPass').value.trim();
  var msg=document.getElementById('loginMsg');
  var btn=document.getElementById('btnLogin');
  if(!u||!p){msg.className='lmsg err';msg.innerText='Isi username dan password!';return;}
  btn.disabled=true;btn.innerText='Loading...';
  msg.className='lmsg';msg.innerText='';
  await loadUsers();
  var user=USERS.find(function(x){return x.nama.toLowerCase()===u.toLowerCase();});
  btn.disabled=false;btn.innerText='Masuk';
  if(!user){msg.className='lmsg err';msg.innerText='Username gak terdaftar!';return;}
  if(user.password!==p){msg.className='lmsg err';msg.innerText='Password salah!';return;}
  var roleBebasExpired=['developer','owner','admin'];
  if(roleBebasExpired.indexOf(user.role)===-1 && user.expired){
    var today=new Date();
    var expDate=new Date(user.expired);
    if(expDate<today){
      msg.className='lmsg err';
      msg.innerText='❌ Akun sudah expired! Hubungi admin.';
      return;
    }
  }
  msg.className='lmsg ok';msg.innerText='Login berhasil!';
  localStorage.setItem('azka_user',JSON.stringify({nama:user.nama,role:user.role||'user'}));
  setTimeout(showApp,600);
}

function doLogout(){
  if(confirm('Yakin logout?')){
    localStorage.removeItem('azka_user');
    location.reload();
  }
}

function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  var u=JSON.parse(localStorage.getItem('azka_user'));
  document.getElementById('userIco').innerText=u.nama.charAt(0).toUpperCase();
  renderDashboard(u);
  updateAvatar();
  render();
}

function renderDashboard(u){
  var user=USERS.find(function(x){return x.nama.toLowerCase()===u.nama.toLowerCase();});
  var role=u.role||'user';
  var hariIni=new Date();
  var tgl=hariIni.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  document.getElementById('dashName').innerText=u.nama;
  var roleLabel={'developer':'⚡ Developer','owner':'🔱 Owner','admin':'👑 Admin','moderator':'🛡️ Moderator','vip':'💎 VIP','reseller':'🏪 Reseller','user':'👤 Member'};
  var roleColor={'developer':'#8b5cf6','owner':'#dc2626','admin':'#f59e0b','moderator':'#3b82f6','vip':'#ec4899','reseller':'#16a34a','user':'#666'};
  document.getElementById('dashRole').innerText=roleLabel[role]||('👤 '+role);
  document.getElementById('dashRole').style.color=roleColor[role]||'#666';
  document.getElementById('dashToday').innerText=tgl;
  var warn=document.getElementById('dashWarn');
  warn.style.display='none';
  var roleBebasExpired=['developer','owner','admin'];
  if(roleBebasExpired.indexOf(role)!==-1){
    document.getElementById('dashExp').innerText='∞ Permanen';
    document.getElementById('dashExp').style.color='#16a34a';
  }else{
    var expired=(user&&user.expired)?user.expired:null;
    if(!expired){
      document.getElementById('dashExp').innerText='Tidak ada';
      document.getElementById('dashExp').style.color='#991b1b';
    }else{
      var expDate=new Date(expired);
      var sisaHari=Math.ceil((expDate-hariIni)/(1000*60*60*24));
      document.getElementById('dashExp').innerText=expDate.toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
      if(sisaHari<0){
        document.getElementById('dashExp').style.color='#991b1b';
        warn.style.display='block';warn.style.background='#fee2e2';warn.style.color='#991b1b';warn.style.border='2px solid #991b1b';
        warn.innerText='⚠️ Akun sudah expired '+Math.abs(sisaHari)+' hari lalu!';
      }else if(sisaHari<=7){
        document.getElementById('dashExp').style.color='#f59e0b';
        warn.style.display='block';warn.style.background='#fef3c7';warn.style.color='#92400e';warn.style.border='2px solid #f59e0b';
        warn.innerText='⚠️ Akun akan expired dalam '+sisaHari+' hari!';
      }else{
        document.getElementById('dashExp').style.color='#16a34a';
      }
    }
  }
}

var tempFoto=null;

function openEditFoto(){
  var u=JSON.parse(localStorage.getItem('azka_user')||'{}');
  var foto=localStorage.getItem('foto_'+u.nama);
  var preview=document.getElementById('fotoPreview');
  if(foto){preview.innerHTML='<img src="'+foto+'">';}
  else{preview.innerHTML=u.nama.charAt(0).toUpperCase();}
  tempFoto=foto;
  document.getElementById('editFotoModal').classList.add('show');
}

function closeEditFoto(){
  document.getElementById('editFotoModal').classList.remove('show');
  tempFoto=null;
}

function pilihFoto(input){
  var file=input.files[0];
  if(!file)return;
  if(file.size>500*1024){alert('⚠️ Foto kegedean! Max 500 KB.');return;}
  var reader=new FileReader();
  reader.onload=function(e){
    tempFoto=e.target.result;
    document.getElementById('fotoPreview').innerHTML='<img src="'+tempFoto+'">';
  };
  reader.readAsDataURL(file);
}

function simpanFoto(){
  if(!tempFoto){alert('⚠️ Pilih foto dulu!');return;}
  var u=JSON.parse(localStorage.getItem('azka_user')||'{}');
  localStorage.setItem('foto_'+u.nama,tempFoto);
  updateAvatar();
  closeEditFoto();
  alert('✅ Foto profil disimpan!');
}

function hapusFoto(){
  if(!confirm('Hapus foto profil?'))return;
  var u=JSON.parse(localStorage.getItem('azka_user')||'{}');
  localStorage.removeItem('foto_'+u.nama);
  updateAvatar();
  closeEditFoto();
  alert('🗑️ Foto profil dihapus!');
}

function updateAvatar(){
  var u=JSON.parse(localStorage.getItem('azka_user')||'{}');
  var foto=localStorage.getItem('foto_'+u.nama);
  var av=document.getElementById('dashAvatar');
  if(!av)return;
  av.innerHTML='';
  if(foto){
    var img=document.createElement('img');
    img.src=foto;
    av.appendChild(img);
  }else{
    var span=document.createElement('span');
    span.id='dashAvatarText';
    span.innerText=u.nama.charAt(0).toUpperCase();
    av.appendChild(span);
  }
  var cam=document.createElement('div');
  cam.className='cam';
  cam.innerText='📷';
  av.appendChild(cam);
}

function copyToClipboard(text){
  if(navigator.clipboard){navigator.clipboard.writeText(text);}
  else{var ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);}
}

function addUser(){
  var nm=document.getElementById('addNama').value.trim();
  var pw=document.getElementById('addPw').value.trim();
  var rl=document.getElementById('addRole').value;
  var ex=document.getElementById('addExp').value.trim()||null;
  if(!nm||!pw){alert('Isi username dan password!');return;}
  if(nm.length<3){alert('Username minimal 3 karakter!');return;}
  if(pw.length<5){alert('Password minimal 5 karakter!');return;}
  if(USERS.find(function(x){return x.nama.toLowerCase()===nm.toLowerCase();})){alert('Username udah ada!');return;}
  USERS.push({nama:nm,password:pw,role:rl,expired:ex});
  renderSb();
  copyToClipboard(JSON.stringify({users:USERS},null,2));
  alert('✅ User '+nm+' ditambah!\n\n📋 users.json dicopy ke clipboard. Paste di GitHub!');
}

function saveEdit(i){
  var nm=document.getElementById('editNama'+i).value.trim();
  var pw=document.getElementById('editPw'+i).value.trim();
  var rl=document.getElementById('editRole'+i).value;
  var ex=document.getElementById('editExp'+i).value.trim()||null;
  if(!nm||!pw){alert('Isi username dan password!');return;}
  USERS[i].nama=nm;USERS[i].password=pw;USERS[i].role=rl;USERS[i].expired=ex;
  renderSb();
  copyToClipboard(JSON.stringify({users:USERS},null,2));
  alert('✅ User '+nm+' diupdate!\n\n📋 users.json dicopy ke clipboard!');
}

function delUser(i){
  if(!confirm('Hapus user '+USERS[i].nama+'?'))return;
  var nm=USERS[i].nama;
  USERS.splice(i,1);
  renderSb();
  copyToClipboard(JSON.stringify({users:USERS},null,2));
  alert('🗑️ User '+nm+' dihapus!\n\n📋 users.json dicopy ke clipboard!');
}

async function runQuotes(){setL(true);try{var r=await fetch(api('quotes.php'));var j=await r.json();setL(false);if(j.success){var h='<div style="padding:16px;background:#fff;border:3px solid #1a1a1a;border-radius:12px;box-shadow:4px 4px 0 #1a1a1a"><div style="font-size:32px;text-align:center;margin-bottom:8px">💭</div><div style="font-size:14px;font-weight:700;line-height:1.6;font-style:italic">"'+j.quote+'"</div><div style="margin-top:12px;font-size:12px;font-weight:800;color:#666;text-align:right">— '+j.author+'</div></div><button '+BTN+' onclick="runQuotes()">🔄 Quote Lagi</button>';setH(h);}else setH('<b>❌ Gagal</b>');}catch(e){setL(false);setH('<b>❌ '+e.message+'</b>');}}

async function runKisahNabi(){var nabi=document.getElementById('f1').value.trim().toLowerCase();if(!nabi)return alert('Isi!');setL(true);try{var r=await fetch(api('kisahnabi.php')+'&nabi='+encodeURIComponent(nabi));var raw=await r.text();setL(false);var j;try{j=JSON.parse(raw);}catch(e){}if(j&&j.success){var h='<b>📖 '+(j.nabi||nabi)+'</b>';if(j.tahun_kelahiran)h+=box('Tahun Kelahiran',j.tahun_kelahiran);if(j.tempat)h+=box('Tempat',j.tempat);if(j.umur)h+=box('Umur',j.umur);if(j.deskripsi)h+='<div style="margin-top:10px;line-height:1.7;font-size:13px">'+j.deskripsi+'</div>';if(j.kisah)h+='<div style="margin-top:10px;line-height:1.7;font-size:13px">'+j.kisah+'</div>';if(!j.kisah&&!j.deskripsi)h+='<pre style="font-size:10px;white-space:pre-wrap">'+raw+'</pre>';setH(h);}else setH('<b>❌ Nabi gak ditemukan</b><pre style="font-size:10px;white-space:pre-wrap">'+raw+'</pre>');}catch(e){setL(false);setH('<b>❌ '+e.message+'</b>');}}

async function runSholat(){var kota=document.getElementById('f1').value.trim();if(!kota)return alert('Isi!');setL(true);try{var r=await fetch(api('jadwalshalat.php')+'&kota='+encodeURIComponent(kota));var j=await r.json();setL(false);if(j.success){var d=j.data;var h='<b>🕌 '+d.lokasi+'</b>';h+='<div style="font-size:11px;color:#666;font-weight:700;margin-bottom:10px">'+d.tanggal_masehi+' · '+d.tanggal_hijriyah+'</div>';var jdw=d.jadwal;var list=[['Imsak',jdw.Imsak],['Subuh',jdw.Fajr],['Terbit',jdw.Sunrise],['Dzuhur',jdw.Dhuhr],['Ashar',jdw.Asr],['Maghrib',jdw.Maghrib],['Isya',jdw.Isha]];list.forEach(function(x){h+='<div style="display:flex;justify-content:space-between;padding:8px 10px;background:#fff;border:2px solid #1a1a1a;border-radius:8px;margin:6px 0;font-weight:700"><span>'+x[0]+'</span><span style="color:#16a34a">'+x[1]+'</span></div>';});setH(h);}else setH('<b>❌ Kota gak ditemukan</b>');}catch(e){setL(false);setH('<b>❌ '+e.message+'</b>');}}
